[package]
name = "pdrs-exp008-proxy"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "=0.22.1"
bytes = "=1.10.1"
futures-util = { version = "=0.3.31", features = ["sink"] }
http-body-util = "=0.1.3"
httpdate = "=1.0.3"
hyper = { version = "=1.9.0", features = ["client", "server", "http1"] }
hyper-util = { version = "=0.1.20", features = ["client-legacy", "http1", "tokio"] }
serde_json = "=1.0.151"
tokio = { version = "=1.52.1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "io-util", "sync"] }
tokio-tungstenite = "=0.28.0"
