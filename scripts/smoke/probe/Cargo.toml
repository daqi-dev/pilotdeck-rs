[package]
name = "real-provider-probe"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone: deliberately not a member of src/Cargo.toml, so the smoke
# harness can be built without touching the product workspace.
[workspace]
resolver = "3"

[dependencies]
pilotdeck-gateway = { path = "../../../src/pilotdeck-gateway" }
pilotdeck-protocol = { path = "../../../src/pilotdeck-protocol" }
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "time"] }

# The product workspace patches this unpublished data crate; repeat it so the
# probe resolves to the same pinned tree instead of reaching the network.
[patch.crates-io]
icu_collator_data = { path = "../../../src/data/icu_collator_data" }
icu_collator = { path = "../../../src/vendor/icu_collator" }
