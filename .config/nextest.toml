# CI 使用默认核数；失败不重试，慢测试只报告，不终止。
# #1891 fix-r1 注记：slow-timeout 与测试侧 60 s 活性余量同值是巧合的邻界
# （只报告不终止，无影响）；若将来启用 terminate-after，其值必须大于本仓
# 最长的活性看门狗（当前为 host/tests.rs 的 130 s 外圈），否则看门狗到点
# 的同一瞬间 harness 会先杀测试，留下没有断言文本的 KILLED。
[profile.ci]
retries = 0
slow-timeout = { period = "60s" }

# #1525 / #1263：能「按环境跳过」的用例在被跳过时仍然 PASS，而 nextest 默认只回放
# 失败用例的输出——通过用例里的 `skip:` 行（无论 eprintln! 还是直写 stderr 句柄）
# 在 CI 日志里都看不见，等于静默绿。只对这几个可能跳过的用例打开成功输出，避免
# 整个 workspace 的日志膨胀。实测 nextest 0.9.148：`success-output` 只在此 override
# 命中的用例上生效，`pilotdeck` 其余用例保持默认。
#
# fix-r3：`test(=名字)` 是对 nextest 可见**全名**的精确匹配，单元测试的全名带模块路径
# （libtest `--list` 同形），裸叶子名永远选不中（实测 nextest 0.9.150，并在 CI 钉的
# 0.9.148 上复测同一结论：
# `test(=bar)` 对 `foo::tests::bar` 零命中，`test(=foo::tests::bar)` 命中）。
# 因此 `src/` 里的单元测试必须写全名，`tests/*.rs` 的集成测试才用裸名。
# test_metadata_io_driver.py 的守卫按「定义文件在 src/ 还是 tests/」推出应有全名并逐字比对。
# fix-r5：fix-r3 给 `project_files/tests.rs` 的两处 EACCES 臂写了 skip 行，却没把这两个用例
# 登记进来（sibling P1 = boundary P1，两家独立命中）——root 宿主上它们依旧静默绿。
# #1900：同一类遗漏又在 `storage/tests.rs` 的两处 root 臂上被发现（sibling P1），这次一并
# 登记，并把两处改成 `test_skip_line::stderr_skip_line` + `require_permission_faults`。
[[profile.ci.overrides]]
filter = 'test(=case_insensitive_cwd_spelling_writes_and_edits) | test(=nfd_directory_with_nfc_cwd_writes_and_edits) | test(=permission_denied_is_not_reported_as_outside) | test(=grep_outputs_match_real_ts) | test(=clear_failing_inside_delete_entries_rearms_indexed_rows) | test(=dump_request_write_failure_semantics) | test(=committed_marker_with_unreadable_manifest_republishes) | test(=scenarios_match_ts_outcomes_and_trees) | test(=real_ts_tool_budget_and_apply_tool_results_replay) | test(=skills::tests::unreadable_scan_child_matches_real_ts_before_denial_and_after_restore) | test(=skills::tests::real_ts_scenarios_match_outcomes_and_file_trees) | test(=skills::tests::real_ts_and_rust_read_each_others_skill_trees) | test(=runtime::tools::builtin::grep::tests::files_sort_keeps_submillisecond_mtime_precision) | test(=project_files::tests::node_round4_unreadable_huge_file_reports_open_error_first) | test(=project_files::tests::special_files_do_not_block_and_unreadable_files_still_list) | test(=project_files::tests::native_read_errors_match_node_ws_responses) | test(=dispatch::tests::list_projects_preserves_real_node_scandir_error_suppression) | test(=runtime::cron::tests::migration_blocked_dir_tasks_eacces_matches_ts) | test(=runtime::cron::tests::migration_non_utf8_home_keeps_one_physical_key) | test(=native_process::tests::non_utf8_home_and_sidecar_are_refused) | test(=storage::tests::temporary_create_failure_reports_the_transcript_not_the_staging_name) | test(=storage::tests::transcript_open_failure_renders_node_eacces_with_the_supplied_path) | test(=native_process::services_tests::direct_content_with_an_unopenable_path_stays_silent) | test(=test_process::an_unreadable_stat_of_a_possible_child_fails_the_child_audit) | test(=test_process::an_unreadable_holder_of_this_user_fails_the_data_dir_audit) | test(=native_process::methods::transcript_archive::tests::restore_refuses_on_an_unwritable_chat_directory_and_retries_clean)'
success-output = "final"
