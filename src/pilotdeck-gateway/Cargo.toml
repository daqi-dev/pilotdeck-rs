[package]
name = "pilotdeck-gateway"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde_json.workspace = true
pilotdeck-protocol.workspace = true
regex = "=1.13.1"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "net", "signal", "time", "io-util", "sync"] }
tokio-tungstenite = "=0.28.0"
hyper = { version = "=1.7.0", features = ["client", "server", "http1"] }
hyper-util = { version = "=0.1.17", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "=0.1.3"
bytes = "=1.10.1"
