[package]
name = "pilotdeck-gateway"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "net", "signal", "time", "io-util"] }
tokio-tungstenite = "=0.28.0"
hyper = { version = "=1.7.0", features = ["client", "server", "http1"] }
hyper-util = { version = "=0.1.17", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "=0.1.3"
futures-util = { version = "=0.3.31", features = ["sink"] }
bytes = "=1.10.1"
