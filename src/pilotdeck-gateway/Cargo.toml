[package]
name = "pilotdeck-gateway"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# #988: activated only inside this crate's cfg(test) build, never in products.
pdrs-mutants = []

[lints]
workspace = true

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
md-5 = "=0.10.6"
# Fixed TS uses MuPDF; compile bundled C sources for the native PDF parser.
mupdf = { version = "=0.8.0", default-features = false, features = ["base14-fonts", "bundled-fonts"] }
pilotdeck-child-signals = { path = "../pilotdeck-child-signals" }
base64 = "=0.22.1"
libc = "=0.2.190"
sha2.workspace = true
# FileMemoryStore hashText uses Node crypto SHA-1 (10 hex digits).
sha1 = "=0.10.7"
# #1336: WeCom callback envelope is AES-256-CBC with PKCS#7 (Node crypto).
# Pure-Rust RustCrypto crates; decryption only, already in the local cache.
aes = "=0.8.4"
cbc = "=0.1.2"
icu_collator = "=2.1.1"
icu_casemap = "=2.1.1"
# #345 B6: full NFKC via the normalizer already locked by url/idna.
icu_normalizer = "=2.1.1"
icu_locale_core = "=2.3.0"
rustix = { version = "=1.1.5", features = ["fs", "process"] }
serde_json.workspace = true
pilotdeck-protocol.workspace = true
pilotdeck-tokenizer = { path = "../pilotdeck-tokenizer" }
pilotdeck-transport = { path = "../pilotdeck-transport" }
uuid = { version = "=1.27.0", features = ["v4"] }
pilotdeck-yaml = { path = "../pilotdeck-yaml" }
url = "=2.5.8"
regex = "=1.13.1"
fancy-regex = "=0.17.0"
async-imap = { version = "=0.12.0", default-features = false, features = ["runtime-tokio"] }
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
# UTF-16 ECMAScript matching for opt-in user-dialog forms.
regress = { git = "https://github.com/ridiculousfish/regress", rev = "95c04041cd9b30249961eb80d950102c29c9586c", default-features = false, features = ["std", "utf16", "prohibit-unsafe"] }
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "net", "signal", "time", "io-util", "io-std", "sync", "process", "fs"] }
# #1344: slack Socket Mode WS client (SplitSink/SplitStream). Already locked
# as a tokio-tungstenite transitive dependency; no version or download change
# (same feature set: sink+std, no async-await macros).
futures-util = { version = "=0.3.31", default-features = false, features = ["sink", "std"] }
# #1344: production Slack socket-mode URLs are wss:// (the CLI's tokio-tungstenite
# feature set); the fixture mock only speaks ws:// on loopback.
tokio-tungstenite = { version = "=0.28.0", features = ["rustls-tls-webpki-roots"] }
hyper = { version = "=1.7.0", features = ["client", "server", "http1"] }
hyper-util = { version = "=0.1.17", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "=0.1.3"
# #1250: `IdleBody` delegates the wrapped body's size hint so hyper keeps the
# exact-0 framing of the parser-level 400/431 bodies. Already in the tree via
# hyper; no version or download change.
http-body = "=1.1.0"
bytes = "=1.10.1"
# #1209: Node's automatic Date header for native HTTP responses
# (IMF-fixdate). Already locked transitively; no version or download change.
httpdate = "=1.0.3"
# #867: pull-based Node fetch response decoding, pure Rust codecs.
async-compression = { version = "=0.4.51", features = ["tokio", "gzip", "zlib", "deflate", "brotli"] }
# A6.4-pr5 (human-approved 2026-10-20): pure-Rust TLS for provider HTTPS.
# ring backend (no cmake/aws-lc), webpki-roots = Mozilla bundle like Node.
rustls = { version = "=0.23.45", default-features = false, features = ["std", "tls12", "ring"] }
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["http1", "tls12", "ring", "webpki-tokio"] }
# #682: already locked via hyper-rustls; retain bundled roots when adding PEM CAs.
# Mozilla certificate data, CDLA-Permissive-2.0; no new version or binary.
webpki-roots = "=1.0.9"
# Hook-local connect deadline: hyper-util's `Connect` is blanket-implemented
# for `tower_service::Service<Uri>`. Already in the tree via hyper-util
# (same 0.3.3), so this adds no download and no version.
tower-service = "=0.3.3"
# #676: TLS to HTTPS proxies; already locked via hyper-rustls. MIT OR Apache-2.0.
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
# A6.5-pr9b (human-approved 2026-10-20, decisions-20261020 选 A): WHATWG HTML
# tree builder for web_fetch HTML→markdown (baseline: turndown + domino).
html5ever = { version = "=0.40.1", default-features = false }

# A6.6-pr10a (human-approved 2026-10-22, card-edgeclaw-sqlite): EdgeClaw memory
# storage uses bundled SQLite compiled from C source (no prebuilt binary).
# Node 22's built-in SQLite is 3.51.2; rusqlite 0.39.0 bundles 3.51.3.
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled"] }

[dev-dependencies]
serde_json = { workspace = true, features = ["float_roundtrip"] }
tokio = { version = "=1.48.0", features = ["test-util"] }
# #449: the vendored edge guard lexes Rust with proc-macro2 instead of a
# hand-written tokenizer. Already locked at 1.0.107 as a transitive dependency,
# so this adds no new download or version.
proc-macro2 = "=1.0.107"
# #2691: the v6-only preflight occupier (`IPV6_V6ONLY` before the bind) needs
# `Socket::set_only_v6`; tokio 1.48's `TcpSocket` does not expose it and the
# crate forbids `unsafe`. Already locked at 0.6.5 via tokio→mio, so this adds
# no new download or version.
socket2 = "=0.6.5"
