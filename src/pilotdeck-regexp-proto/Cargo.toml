[package]
name = "pilotdeck-regexp-proto"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-only"
publish = false

# Deliberately independent: the product workspace never resolves or links QuickJS.
[workspace]

[dependencies]
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }

[dev-dependencies]
serde_json = "=1.0.151"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
strip = true
panic = "abort"
