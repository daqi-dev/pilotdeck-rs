[package]
name = "pilotdeck-cli"
version = "0.1.0"
default-run = "pilotdeck"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pilotdeck"
path = "src/main.rs"

[[bin]]
name = "pilotdeck-control"
path = "src/bin/pilotdeck-control.rs"

[dependencies]
pilotdeck-image-native = { path = "../pilotdeck-image-native" }
pilotdeck-gateway = { path = "../pilotdeck-gateway" }
pilotdeck-protocol.workspace = true
pilotdeck-yaml = { path = "../pilotdeck-yaml" }
bytes = "=1.10.1"
hyper = { version = "=1.7.0", features = ["client", "http1"] }
http-body-util = "=0.1.3"
url = "=2.5.8"
sha2.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }
serde_json.workspace = true
fancy-regex = "=0.17.0"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
icu_casemap = "=2.1.1"
pilotdeck-transport = { path = "../pilotdeck-transport" }
libc = "=0.2.190"
signal-hook = { version = "=0.3.18", default-features = false }
icu_collator = "=2.1.1"
icu_locale_core = "=2.3.0"
tokio = { version = "=1.48.0", features = ["rt", "net", "time", "sync"] }
tokio-tungstenite = { version = "=0.28.0", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "=0.3.31", default-features = false, features = ["sink", "std"] }
hyper-util = { version = "=0.1.17", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["http1", "tls12", "ring", "webpki-tokio"] }
uuid = { version = "=1.27.0", features = ["v4"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29", "unstable-rendered-line-info", "unstable-backend-writer"] }
crossterm = "=0.29.0"
unicode-segmentation = "=1.13.3"

[dev-dependencies]
serde_json.workspace = true
# #1145: lex the accepted stderr match domain with the same lexer as unsafe_boundary.
proc-macro2 = "=1.0.107"
# Write-stage signal registration and the real WebSocket CLI replay tests.
tokio = { version = "=1.48.0", features = ["rt", "signal", "macros", "test-util"] }

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["event", "fs", "process", "termios"] }

# macOS process regressions need a real terminal on stdin, with stdout/stderr
# kept separate. Reuse the pinned runtime crate; no additional package.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "=1.1.5", features = ["pty"] }

[build-dependencies]
pilotdeck-image-native = { path = "../pilotdeck-image-native" }
