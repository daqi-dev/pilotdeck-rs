[package]
name = "pilotdeck-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pilotdeck"
path = "src/main.rs"

[dependencies]
pilotdeck-gateway = { path = "../pilotdeck-gateway" }
pilotdeck-protocol.workspace = true
sha2.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }
serde_json.workspace = true
fancy-regex = "=0.17.0"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
icu_casemap = "=2.1.1"
pilotdeck-transport = { path = "../pilotdeck-transport" }
libc = "=0.2.190"
icu_collator = "=2.1.1"
icu_locale_core = "=2.3.0"

[dev-dependencies]
serde_json.workspace = true
# Only the write-stage child test: `ensure_sigxfsz_ignored` registers through
# tokio's safe signal API and needs a runtime with the signal driver.
tokio = { version = "=1.48.0", features = ["rt", "signal"] }

[lints]
workspace = true
