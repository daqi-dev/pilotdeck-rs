[package]
name = "pilotdeck-collation-datagen"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[workspace]

[dependencies]
icu_provider_source = { version = "=2.1.1", default-features = false }
icu_collator = { version = "=2.1.1", features = ["datagen"] }
icu_provider = { version = "=2.3.1", features = ["export"] }

[profile.dev]
debug = 0
incremental = false

# 2.1.2 registry advertises property markers absent from source 2.1.1.
[dependencies.icu_provider_registry]
version = "=2.1.1"

[dependencies.icu_provider_export]
version = "=2.1.1"
default-features = false
features = ["baked_exporter"]

[dependencies.icu_locale]
version = "=2.1.1"

[dependencies.sha2]
version = "=0.10.9"
