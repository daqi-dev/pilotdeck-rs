# gitleaks 配置：继承默认规则，按值放行已知非密钥。
# 值级条目（哈希、RFC 6455 nonce、A8.3 测试 AES key）用 regexTarget="secret" + ^…$ 精确放行；
# 5 条 PEM 片段条目是唯一例外，只用 match 子串语义——判据是「解码后真是私钥 DER 的开头」
# （SEQUENCE + INTEGER 版本号 0/1 + AlgorithmIdentifier/私钥 OCTET STRING），不是按值的形状或前缀分桶，
# 所以大写 hex / 128-hex / 带前缀的 sha256:… / 普通长 base64 都进不了这个桶。
# 口径由 scripts/check-gitleaks-allowlist.py 机检（CI 静态 + 变异负控；行为负控需本机 gitleaks）。
# 注意：全局 allowlist 的 paths 会整文件跳过扫描（8.30 实测），因此这里只用值，不用路径。
[extend]
useDefault = true

[[allowlists]]
description = "MuPDF 原始 pkcs7-openssl.c 的 C 类型名 PKCS12_SAFEBAG 被 generic-api-key 从函数形参声明误抽取；它是公开 OpenSSL 类型标识符，不是凭据。只放行 Secret 完全等于此标识符的命中，不跳过文件或目录。"
regexTarget = "secret"
regexes = ['''^PKCS12_SAFEBAG$''']

[[allowlists]]
description = "sop_control_authority_tests.rs 的回环 mock discoveryApiKey：顺序数字加 fixture-key 字面量，不对应任何账号或服务；仅放行精确测试值，前后缀或其他值仍扫描。"
regexTarget = "secret"
regexes = ['''^12345678901234567890-fixture-key$''']

[[allowlists]]
description = "WeCom media-capture.mjs 的公开 AES 测试向量：整数 0..31 组成的 32 字节数组再编码为无补位 base64，不是账号凭据；仅放行该精确值，包含此前后缀或其他值仍扫描"
regexTarget = "secret"
regexes = ['''^AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8$''']

