name: pr-gate

# 合并闸门第 2、3 步的机器检查（scripts/check-pr-gate.py）。单独成文件：
# ci.yml 的 pull_request 默认不含 edited，改 PR 描述不会重跑；这里显式加上。
# 设为分支保护必需检查属仓库设置，由协调者在本文件合入后另做（CLAUDE.md 第 14 条范围内）。
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

jobs:
  pr-gate:
    # 10-29：草稿（首次推送即开、早跑 CI）尚未贴结果块，判必红、只制造噪声；转 ready 时由 ready_for_review 触发。
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 补丁指纹要算 git diff <base>...<head>，浅克隆没有 merge-base
      - name: 显式取 base 分支与 PR head（不依赖 checkout 的默认 refspec）
        # fix-r6 起本 step 喂的不只是指纹：PR_BASE/PR_HEAD 也是修复轮主信号（PR 范围提交标题
        # 集合，git log PR_BASE..PR_HEAD）的输入。取不到时的降级路径：两 ref 在下一步解析失败
        # → git log 非零退出 → 修复轮判定 fail-closed 拒收（不得当非修复轮放行）；--base/
        # --head/--repo 只缺其一件（本地路径形态）→ check-pr-gate 打 stderr 显式告警
        # 「修复轮主信号不可用：缺 …」后降级正文首行兜底；指纹算不出 → 结果块 head 不符时
        # 不再沿用。不挡两 ref 都解析成功、head 一致的 PR
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        # r8 P1-2：step 级 shell 优先于任何层级的 defaults.run.shell（同 ci.yml
        # 评审 r7 P0 的执行层解）——本文件的两个 run step 此前没有钉 shell。
        shell: bash
        run: |
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" "${PR_HEAD}"
          git rev-parse --verify "origin/${BASE_REF}^{commit}"
          git rev-parse --verify "${PR_HEAD}^{commit}"
      - name: 角色审计结果块与 issue 关联
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          # 用 base 分支当前 tip（事件里的 base.sha 可能过期）；三点 diff 取 merge-base，main 前进不影响指纹
          PR_BASE: origin/${{ github.base_ref }}
        shell: bash  # r8 P1-2：合并闸门本体——check-pr-gate step 不许被 defaults 换壳
        run: python3 -I scripts/check-pr-gate.py
