name: ci

# 钉版（#2762）：2026-11-09 ubuntu-latest 滚 26.04（镜像 20261101.186.1）致三测稳定红，所有 runs-on 钉回 ubuntu-24.04。

# r7（#1809 评审 P0）：本文件**每个** run step 都显式 `shell: bash`。step 级
# `shell:` 优先于 workflow / job 级 `defaults.run.shell`（GitHub workflow syntax：
# "You can override the default shell settings … using the `shell` keyword"），
# 因此往任何层级塞 `defaults.run.shell: /bin/true {0}` 都废不掉任何一个检测步——
# 尤其是必需检查 `check` 的 Require 步与各闸门步。接线守卫
# （scripts/retirement-outcome-parity/self_check.py 的 check_wiring）与兄弟守卫
# （src/pilotdeck-gateway/tests/test_metadata_io_driver.py）都断言「每个 run step
# 必须带 `shell: bash`」，删掉或换值即红。

on:
  pull_request:
  push:
    branches: [main]
  # merge queue：必需检查 check / gateway-schema-baseline 必须也在队列的临时合并提交上跑，否则进队 PR 永远等不到结果
  merge_group:

jobs:
  # #1199：改动只碰唯一精确路径 state/board.md 时输出 docs_only=true，各重 job 才允许跳过；
  # state/ .42cog/ docs/ 的其余文件是重 job 尺子的输入，不放行（fix-r1 收窄，见
  # state/decisions-20261031-ci-docs-scope.md）。本 job 自身无条件运行（先跑分类器自测），
  # 重 job 的跳过只认它的输出，check 只放行「skipped 且 docs_only=true」这一条路径。
  scope:
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          # base..head 两点 diff 要 PR / merge group 的历史，浅克隆没有
          fetch-depth: 0
      - name: 分类器自测（正负例与内存内变异负控）
        shell: bash
        run: python3 -I scripts/test-ci-scope.py
      - name: 分类改动范围（docs-only 判定，fail-closed）
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        shell: bash
        run: python3 -I scripts/ci_scope.py

  metadata-observer:
    needs: [scope]
    if: ${{ needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      # #2017-A：下方聚合门控守卫自 r6 起按 PyYAML 解析后的完整标量判（job 级 /
      # 聚合 step 级 `if:` / `needs:`），解析器版本钉死 6.0.3，与
      # retirement-outcome-parity 装置同一登记。显式用 venv 解释器跑本步，不影响
      # 本 job 其它步骤的 `python3`。
      - name: 安装钉死 PyYAML（#2017-A）
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/pyyaml-pinned"
          "$RUNNER_TEMP/pyyaml-pinned/bin/pip" install --disable-pip-version-check pyyaml==6.0.3
      - name: CI 聚合门控与各 job 的 Node 前置守卫
        working-directory: src/pilotdeck-gateway/tests
        shell: bash
        # #2136 fix-r39（DS sibling#1 / concurrency#2 P2）：本步真跑
        # EnvironmentControls 全套（#994/#1570/#1666/#2133 四条真跑钉都在
        # 其中，r38 实测本机 764 s），挂起时却占满 job 默认 360 分钟——
        # 正是那四条钉注释里要消灭的场景搬到了本步；照 #2133 步同法声明
        # 步级超时（30 min ≈ 2.4× 余量），由 driver 守卫钉住。
        timeout-minutes: 30
        run: '"$RUNNER_TEMP/pyyaml-pinned/bin/python" -m unittest -v test_metadata_io_driver.EnvironmentControls'
      - name: metadata observer generation 正负控（自有文件）
        shell: bash
        run: node src/pilotdeck-gateway/tests/test_metadata_observer.mjs
      - name: 共享执行器隔离与候选正控回归（#994）
        shell: bash
        # #2136 fix-r38（MM sibling P2）：本套件 r38 干净树实测 23 条约 354 s
        #（CI 约 583 s），挂起时却占满 job 级 360 分钟默认上限，把同 job 别步
        # 拖死；照 #2133 步同法声明步级超时（预算 + 余量），由
        # test_metadata_io_driver 钉住（守卫 + 真跑钉 + 变异负控）。
        timeout-minutes: 15
        run: python3 -B src/pilotdeck-gateway/tests/fixtures/test_negative_adaptive_isolation.py
      # #2133：宿主负控清单由 neg-for-diff.sh 按 diff 推导，它用字面串
      # `目录/文件名` 去 fixtures 里 `git grep -F`。表里写成「常量 / 裸文件名」
      # 时这个字面串根本不在文件里 → 改产品文件时该表不进负控 → 假 PASS。
      # 本步逐表复算裸文件名拼接的键（含 .json/.mts 等夹具文件，发现循环对
      # `src/*.rs` 与 `fixtures/**` 都生成键），断言每张表声明的 DISCOVERY_ANCHORS 与之
      # 完全一致且每个键确实字面出现在该表文本中；解析不了的仓库路径、起点能证明是
      # 仓库根的字符串 `+` / f-string 拼法、不支持的调用形状、仓库目录枚举按失败处理，
      # 不静默跳过（全字面量的 `'sms' + '/' + 'mod.rs'` 是 README 登记的静默盲区：
      # 同一形状在 network-timing/negative_private.py 里拼的是单元测试标签）；
      # 表 import 的每个本地模块（顶层助手、`_shared` / `_negkit` 库模块、同目录模块、
      # 包的 `__init__.py`、相对 import）同样要求锚点，且沿 import 传递（助手自己
      # import 的助手也算）；全目录扫描的跳过清单与宿主 `grep -vE` 逐项相同，
      # 只 import 助手的新表同样变红。
      # 判别力由负控自证：
      # 逐条删掉锚点、注入一条新行、`TABLES` 为空、锚点重复赋值、新盲表 / 新不可解表
      # 未登记、登记条数过期。纯静态，不需要 cargo。
      # 当前登记 #2133 点名的 4 张表；其余同类盲表逐张记在测试的 KNOWN_BLIND 登记里
      # （约定见 fixtures/README.md，逐表清单见 #2141），新盲表出现即本步变红。
      - name: 网关负控发现锚点自检（#2133）
        working-directory: src/pilotdeck-gateway/tests/fixtures
        shell: bash
        # #2136 fix-r37（MM concurrency P2a）：本步纯静态、实测约 1 分钟，
        # 挂起时却占满 job 级 360 分钟默认上限，别的步骤全被拖死；
        # 卡死须当轮失败，不许慢慢烧。真跑钉（Ran N / 无 skip）在
        # test_metadata_io_driver.py，与本步守卫互补。
        timeout-minutes: 10
        run: python3 -B -m unittest -v test_negative_discovery_anchors
      # #1666 / #1734：负控脚本的守卫不得依赖 assert —— `python3 -O` /
      # `PYTHONOPTIMIZE=1` 会把 assert 整条剥离，靠 assert 的守卫在优化解释器下静默
      # 放行（未知变异名 → `0/0 killed`、rc=0）。这两个自测在加与不加 `-O` 的解释器下
      # 各复算**未知变异名**这一条拒绝路径（其余拒绝路径由 settings-gateway 的进程内
      # 用例覆盖，不在 -O 下），且第一个用例先自证本解释器确实剥离 assert（否则整组
      # 结论无意义）；另有一条只减不增的裸 assert 存量登记。两者都不需要 cargo。
      - name: 网关负控守卫 -O 不变性自测（#1666/#1734）
        working-directory: src/pilotdeck-gateway/tests/fixtures
        shell: bash  # #1809 r9：合并带入的步骤补钉（r7 P0 执行层守卫）
        # #2136 fix-r38（MM sibling P2）：五个模块 r37 实测合计约 15 s，
        # 挂起时同样占满 job 默认 360 分钟；由 driver 守卫钉住。
        # r41（合并 main）：#2590 fix-r2 增第六模块（issue-2495，实测
        # Ran 30、约 4 s），真跑钉与守卫已同步扩到六模块。
        timeout-minutes: 5
        run: |
          python3 -B -m unittest -v test_negative_optimize_guards
          python3 -B -m unittest -v settings-gateway/test_negative_controls.py
          # #1922：判决层四条 raise 判杀守卫（_shared/negative_control.py 的 run()）与
          # network-timing 两条 OSError→refuse() 分支（negative_controls.py 模块级源码重读、
          # negative_private.py 的 catalog）此前只有静态「无裸 assert」机检、无 -O 行为用例。
          # 两者都在 -O 子进程里跑真实源码（假 cargo / 一处注入编辑），不需要 cargo 名额。
          python3 -B -m unittest -v test_negative_run_guards
          python3 -B -m unittest -v network-timing/test_negative_controls.py
          # #2309 fix-r3：manager-gateway 的「先核对名册后发布」此前无任何机检分母——
          # 删一条 EXPECTED_NAMES 或把 recorded != expected 拆成常量，CI 仍全绿。
          # 该自测桩掉 cargo 三件套与源守卫窗口后驱动真实 main()，跑批真名册、
          # 真锚点 mutate、真发布；不需要 cargo 名额。
          python3 -B -m unittest -v test_negative_roster_guards
          # #2590 fix-r2（评审 P1 CI 接线，取高裁定）：issue-2495 的守卫机检同形进 CI
          # （settings-gateway:88 / network-timing:94 同款），30 例纯 Python——含后台进程
          # 真实占树锁、断言锁忙落 rc 2 + INVALID: 而非 traceback 的用例，
          # 取得阶段拒跑（锁超时 / 树脏）撤目录、还原窗口超时退 1、取得段裸异常
          # 仍按失败关闭退 1 的相位分界用例，不需要 cargo。
          python3 -B -m unittest -v issue-2495/test_negative_controls.py
      # #1570：共享负控的副本清单从源码推导（src/ 之外被编译期读取的输入）。
      # 漏一份不会表现成「变异存活」，而是整条变异 INVALID——尺子静默失去判别力。
      # 这里跑推导与 fail-closed 边界的自测；不需要 cargo。
      - name: 共享副本清单推导自测（#1570）
        working-directory: src/pilotdeck-gateway/tests/fixtures
        shell: bash  # #1809 r9：合并带入的步骤补钉（r7 P0 执行层守卫）
        # #2136 fix-r38（MM sibling P2）：r37 实测约 21 s，同上钉住。
        timeout-minutes: 5
        run: python3 -B -m unittest -v _shared.test_compile_inputs
      # #1203：CLI fixtures 的负控脚本自带 --check 锚点自检，但此前没有任何闸门跑它——
      # #1145 重构 transport.rs 后 stream-event-field 锚点过期（6 条里 5 条有效），CI、
      # 宿主清单、neg-for-diff 都没拦住，靠最终评审读码才发现。glob 统一覆盖今后新增的
      # 带 --check 脚本；任一锚点失配即本步非零退出；glob 一个都匹配不到同样按失败处理
      # （闸门不允许静默通过）。本地负控：故意改坏 transport.rs 的 stream-event-field 锚点
      # 后 --check 报 5/6 valid、rc=1（_tmp/20261026-issue-1053/neg-1203/）。
      - name: CLI fixtures 负控 --check 锚点自检（#1203）
        shell: bash
        run: |
          found=0
          for script in src/pilotdeck-cli/tests/fixtures/*/negative_controls.py; do
            [ -f "$script" ] || continue
            found=1
            python3 -I "$script" --check
          done
          if [ "$found" -ne 1 ]; then
            echo 'no src/pilotdeck-cli/tests/fixtures/*/negative_controls.py found; the anchor gate must not silently pass' >&2
            exit 1
          fi
          # #1509 P2-2d：cron-schedule 的 --check 除锚点外还机检 README 段计数 / Rows 清单 /
          # 每个 oracle 格有绑定回放 / 每条变异绑定的测试真的存在，但 #1203 的 glob 只覆盖
          # CLI fixtures，这些手工副本此前仍无闸门（缺文件即 python3 非零，不静默通过）。
          python3 -I src/pilotdeck-gateway/tests/fixtures/cron-schedule/negative_controls.py --check
          # #2409：cron-scheduler 同口径接入——其 --check 除锚点外还机检 README 的
          # 变异计数与 Rows 清单须与 mutations 表逐项一致、金样格数两处手抄须与
          # oracle.json 的 cells 数一致、每条变异绑定的测试名经 declares_test 在
          # scheduler_tests.rs 中确实存在（该 README 计数曾漂移过一次，靠 fix-r3 才手工改正）。
          python3 -I src/pilotdeck-gateway/tests/fixtures/cron-scheduler/negative_controls.py --check
          # #1364 P0-a：闸门自身的负控。这些脚本清空 mutations 后跑 --check 必须
          # 非零退出；若有人删掉 fail-closed 分支，--self-check 立即变红。
          # 今后新增带 --check 的脚本按需补同一接口，本步不强制。
          # #2140 fix-r2：skills-fr-ca-probe 接入同一接口（评审 sibling#1）。
          # #2170 fix-r3：native-collation 补齐 --self-check 后接入（DS r1 sibling#2）。
          for script in src/pilotdeck-cli/tests/fixtures/sdk-decode-budget/negative_controls.py \
                        src/pilotdeck-cli/tests/fixtures/sdk-stdin/negative_controls.py \
                        src/pilotdeck-cli/tests/fixtures/skills-fr-ca-probe/negative_controls.py \
                        src/pilotdeck-gateway/tests/fixtures/native-collation/negative_controls.py; do
            python3 -I "$script" --self-check
          done
      # #1595 / #1594：`.gitleaks.toml` 的值级放行必须是 regexTarget="secret" + ^…$ 锚定
      # （原来 7 条哈希类用 match 是子串语义，Secret 里含该哈希的更长值会被顺带放行）。
      # 这里只跑不需要 gitleaks 的静态口径 + 检查器自身的变异负控；行为负控（真跑 gitleaks
      # 造「恰等于 / 含但不等于」样本）在有 gitleaks 的机器上由 `--static` 之外的模式执行，
      # CI runner 不带 gitleaks（红线：不下载预编译二进制）。
      - name: gitleaks 放行口径静态检查（#1595/#1594，含变异负控）
        shell: bash
        run: python3 -I scripts/check-gitleaks-allowlist.py --static --self-check

  # #1632：session-assembly-1316 负控夹具此前只在本机与宿主链跑，CI 里没有任何闸门——
  # 锚点过期（源码改了、变异表没跟）或某条变异不再被杀，都没有 CI 步骤会红。先做静态
  # 锚点自检与槽位守卫自检（不跑 cargo），再逐条应用变异、跑点名测试、按字节还原；任一
  # 条非 KILLED 即非零退出。#1632 P2-3。本 job 与 rust 并行起跑，但 check 汇聚它，因此
  # 它仍在合并闸门的关键路径上。
  negative-controls:
    needs: [scope]
    if: ${{ needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    # 上界只作兜底：夹具自己按 PDRS_NEGCTL_DEADLINE（默认 5400 s）收口，并在
    # 截止 / SIGTERM 时还原源码、发 TIMEOUT summary 后非零退出（#1692 §1）。
    # 实测（run 42176640534）：平台 job 超时**不会**跳过 `if: always()` 上传，但会
    # 在两条变异之间硬杀进程 —— 源码停在变异态、没有 progress/summary、job 记成
    # cancelled 而不是有界红。所以这里的分钟数必须大于夹具内部预算 + 余量，
    # 由 test_metadata_io_driver 钉死。
    timeout-minutes: 150
    env:
      # #1692 §3：负控跑的是同一批 cargo 测试；不压 debuginfo 时每次调用要额外
      # 写几百 MB 的 DWARF，直接把 90 min 的预算耗在磁盘上。
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      # 夹具要求调用方提供 target；#1166 共享入口拒收 src/ 内与仓库根目录，
      # 树内 _build/cargo-target 是本仓负控的既有约定（fixtures/README.md）。
      CARGO_TARGET_DIR: ${{ github.workspace }}/_build/cargo-target
    steps:
      - uses: actions/checkout@v4
        with:
          # 变异前要按 git show HEAD:<path> 证明源码未被改动
          fetch-depth: 0
      # 盲区⑤ fix-r1（#2780 MM P1-2）：同款 runner 镜像漂移守卫复制进本 job——
      # 本 job 同样 runs-on ubuntu-24.04、装同一 rust 工具链跑同一批 cargo 测试
      # （上限 150 min），镜像漂移时 KILLED/SURVIVED 结论可能被翻转，负控必须在
      # 镜像与 rust job 一致的前提下才有判别力。fix-r2（#2780 MM）：反向断言改
      # 白名单值等（ci.yml + pr-gate.yml 全部 runs-on == 钉定标签），并加
      # $ImageOS/$ImageVersion 构建维度断言（两 job 同绿 ⟺ 同一镜像构建）；
      # 脚本与 rust job 的守卫逐字相同（test_metadata_io_driver 逐字全等机检）。
      - name: runner 镜像漂移守卫（#2762）
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          # 期望值单点：本步四个钉值全在下面四个变量里（fix-r2 起两副本由
          # test_metadata_io_driver 逐字全等机检钉住，改钉必须两处同改）。
          # fix-r3（#2780 anthropic boundary P1，协调者裁 b）：构建号钉值从单一
          # 精确值改为钉值集合 expected_image_versions（空格分隔，命中任一即绿）。
          expected="24.04"
          expected_label="ubuntu-24.04"
          expected_image_os="ubuntu24"
          expected_image_versions="20261101.360.1"
          # PDRS_IMAGE_GUARD_OS_RELEASE 只重定向 os-release 的读取路径（供本仓
          # 守卫逻辑自测注入假 os-release），钉值比对不变；该行被机检钉死。
          os_release="${PDRS_IMAGE_GUARD_OS_RELEASE:-/etc/os-release}"
          actual=""
          if [ -r "$os_release" ]; then
            . "$os_release"
            actual="${VERSION_ID:-}"
          fi
          if [ "$actual" != "$expected" ]; then
            echo "::error::runner 镜像漂移：实际 OS 版本=\"${actual:-<读不到>}\"，钉定=\"$expected\"（#2762：全仓稳定红先查 runner 镜像，别逐个测试倒查）" >&2
            exit 1
          fi
          # fix-r2（#2780 MM P1）：构建维度。GitHub 托管镜像按构建滚动，VERSION_ID
          # 不变的镜像重指 / 滚动窗口内两 job 落在不同构建都会翻转 KILLED/SURVIVED
          # 结论。fix-r3（#2780 anthropic boundary P1，协调者裁 b）：单一精确构建号
          # 在滚动窗口内没有稳定绿值（fleet 分批换版本），改为钉值集合——两副本钉
          # 同一集合，实际值命中任一成员即绿。滚动窗口处置流程：① 守卫红且错误行
          # 显示的「实际构建号」经值班协调者确认为上游 runner-images 新滚动版本后，
          # 把该值追加进 expected_image_versions（两副本同改，全等机检强制），当轮
          # 恢复绿；② 窗口结束（上游该版本 rollout 完成、实际值连续几天稳定在新值）
          # 后由值班协调者删旧值，收窄回单值。谁做/何时：值班协调者，红当轮加新值、
          # 窗口结束当轮删旧值。窗口内两 job 可能落在集合内不同构建上，「同绿」语义
          # 放宽为「同在已登记集合」；需要严格同构建的对拍/负控结论时先删旧值收窄
          # 再跑。空集合与未提供实际值都 fail-closed：不提供不等于命中集合。
          image_os="${ImageOS:-}"
          image_version="${ImageVersion:-}"
          if [ -z "${expected_image_versions// /}" ]; then
            echo "::error::钉值集合 expected_image_versions 为空，fail-closed（#2780 fix-r3：空集合守卫哑炮）" >&2
            exit 1
          fi
          if [ "$image_os" != "$expected_image_os" ] || [ -z "$image_version" ]; then
            echo "::error::runner 镜像漂移：实际 ImageOS=\"${image_os:-<未提供>}\" ImageVersion=\"${image_version:-<未提供>}\"，钉定 ImageOS=$expected_image_os ImageVersion∈{$expected_image_versions}（#2780 fix-r3：镜像滚动先红再改钉，别拿漂移构建上的结论）" >&2
            exit 1
          fi
          version_hit=0
          for member in $expected_image_versions; do
            if [ "$image_version" = "$member" ]; then
              version_hit=1
              break
            fi
          done
          if [ "$version_hit" -ne 1 ]; then
            echo "::error::runner 镜像漂移：实际 ImageVersion=\"$image_version\" 不在钉定集合 {$expected_image_versions}（#2780 fix-r3：确认为上游新滚动版本后把该值追加进集合，两副本同改）" >&2
            exit 1
          fi
          echo "runner 镜像守卫通过：OS 版本 $actual / ImageOS $image_os / ImageVersion $image_version ∈ 钉定集合 {$expected_image_versions}"
          # fix-r2（#2780 MM P1）：反向断言从「字面量 ubuntu-latest 黑名单 × 仅
          # ci.yml」改为白名单值等——ci.yml 与 pr-gate.yml 的全部非注释 runs-on 值
          # 必须等于钉定标签，任何其他值（ubuntu-latest / -arm / 26.04 / 22.04 /
          # matrix 拼装）一律红。键形态连引号键一起认（#2017 先例）。fix-r1 的
          # 「目标可读前置核 + grep rc 三分」口径保留，另加零命中 fail-closed。
          for guard_target in .github/workflows/ci.yml .github/workflows/pr-gate.yml; do
            if [ ! -r "$guard_target" ]; then
              echo "::error::反向断言目标 $guard_target 不可读，fail-closed（#2780 fix-r2：断言不许哑炮放行）" >&2
              exit 1
            fi
            rc=0
            raw="$(grep -nE "^[[:space:]]*['\"]?runs-on['\"]?[[:space:]]*:" "$guard_target")" || rc=$?
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
              echo "::error::grep 检查 $guard_target 异常退出 rc=$rc，fail-closed（#2780 fix-r2）" >&2
              exit 1
            fi
            if [ -z "$raw" ]; then
              echo "::error::$guard_target 一条 runs-on 都没解析到，fail-closed（#2780 fix-r2：白名单不许静默通过）" >&2
              exit 1
            fi
            while IFS= read -r hit; do
              [ -n "$hit" ] || continue
              body="${hit#*:}"
              trimmed="${body#"${body%%[![:space:]]*}"}"
              key="${trimmed%%:*}"
              key="${key//[[:space:]]/}"
              case "$key" in
                runs-on|\'runs-on\'|\"runs-on\") ;;
                *) echo "::error::$guard_target 解析到非 runs-on 行 \"$hit\"，fail-closed（#2780 fix-r2）" >&2
                   exit 1 ;;
              esac
              value="${trimmed#*:}"
              value="${value%%#*}"
              value="${value//\"/}"
              value="${value//\'/}"
              value="${value//[[:space:]]/}"
              if [ "$value" != "$expected_label" ]; then
                echo "::error::$guard_target 的 runs-on 值 \"$value\" != 钉定 \"$expected_label\"（#2762：全部 runs-on 必须钉 $expected_label）" >&2
                printf '%s\n' "$hit" >&2
                exit 1
              fi
            done <<< "$raw"
          done
          echo "runs-on 白名单反向断言通过：ci.yml 与 pr-gate.yml 非注释 runs-on 全部 == $expected_label"
      - name: 锁定工具链
        shell: bash
        run: rustup show active-toolchain
      # 只缓存 cargo 注册表 / git 源，不缓存 target：夹具的护身扫描器
      # （`negative_process._ensure_workspace_scanner`）见到现有可执行文件就直接复用、
      # 从不重建，而它的源码摘要 `include_str!` 冻结在二进制里。缓存还原出上一轮的
      # target 就会让「改了扫描器输入的 PR」拿到旧二进制 → 摘要不等 → SourceBaselineError
      # → 闸门假红，且报错让人「prebuild」，在 CI 里做不到（#1632 评审 P1）。
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: negctl-cargo-${{ runner.os }}-${{ hashFiles('src/Cargo.lock') }}
      - name: 网关负控锚点自检 + 槽位守卫自检（#1632）
        # --anchors-only 只读扫描全部网关夹具，任一锚点失配 / 脚本消失即 rc=1；
        # --self-check 证明槽位守卫在 python3 -O 下仍有界退出（旧 assert 版在 -O 下无界等待）；
        # --self-check-controls 逐条删掉自检里的守卫（截止拒绝 / 进度落盘 / 树锁持有 /
        # 空 gates 表）再跑一遍副本，全部必须变红，否则打印 SURVIVED 并非零退出（#1692）。
        shell: bash
        run: |
          python3 -I src/pilotdeck-gateway/tests/fixtures/anchor_selfcheck.py --anchors-only
          python3 -I src/pilotdeck-gateway/tests/fixtures/session-assembly-1316/negative_controls.py --self-check
          python3 -I src/pilotdeck-gateway/tests/fixtures/session-assembly-1316/negative_controls.py --self-check-controls
      # #1989：绑定自身的漂移自检。native 入口的 --check 只由宿主链执行，CI 此前一条
      # 都不跑；这三组是纯 Python（不碰 cargo），逐条变异绑定的源码再要求对应 needle
      # 报错——「把断言改成 assert!(true) / 删掉上限断言 / 改掉换行守卫的返回动作」
      # 三种已实测的假绿都在这里变红。
      - name: 绑定漂移自检（#1989）
        shell: bash  # #1809 r9：合并带入的步骤补钉（r7 P0 执行层守卫）
        run: |
          python3 -B src/pilotdeck-gateway/tests/fixtures/test_negative_source.py
          python3 -I src/pilotdeck-gateway/tests/fixtures/native-entry-authority/test_native_entry_binding.py
          python3 -I src/pilotdeck-gateway/tests/fixtures/native-entry-authority/negative_controls.py --check
          python3 -I src/pilotdeck-gateway/tests/fixtures/native-entry-authority/early_exit_invalid.py --check
          # #1433 fix-r1（评审 P2#5，照 #1989 对 native 入口 --check 的先例）：会话 MCP
          # 负控夹具的 --check 也进 CI——锚点 / 绑定 / 静态名册任一漂移即本步非零退出，
          # 不再只靠宿主链；全量杀灭轮（需要 cargo 与净树）仍由协调者在宿主跑。
          python3 -I src/pilotdeck-gateway/tests/fixtures/sdk-mcp-session-tools/negative_controls.py --check
          # #1354（minimax r2 P2，同一先例）：入口路由负控夹具的 --check 同理进 CI。
          python3 -I src/pilotdeck-gateway/tests/fixtures/mode-routing/negative_controls.py --check
          # #2391 fix-r1（评审三家同条，同 #1433/#1354 先例）：transcript-write 预留与
          # session-delete 清理两套新负控夹具的 --check 也进 CI——锚点 / 绑定 / 静态名册
          # 任一漂移即本步非零退出；全量杀灭轮（需要 cargo 与净树）仍由协调者在宿主跑。
          python3 -I src/pilotdeck-gateway/tests/fixtures/session-reservation-2391/negative_controls.py --check
          python3 -I src/pilotdeck-gateway/tests/fixtures/session-delete-2392/negative_controls.py --check
          # #2590 fix-r2（评审 P1 CI 接线，同 #1433/#2391 先例）：issue-2495 负控夹具的
          # --check 也进 CI——锚点 / 绑定 / 静态名册 / 模板断言任一漂移即本步非零退出
          # （stale 扫描在树锁内读净树，锁忙本身也是 rc 2 拒跑）；全量杀灭轮（需要 cargo
          # 与净树）仍由协调者在宿主跑。
          python3 -I src/pilotdeck-gateway/tests/fixtures/issue-2495/negative_controls.py --check
          # #2513 fix-r1（评审 P2#3，同 #1433/#2590 先例）：parity-env-isolation 负控
          # 夹具的 --check 进 CI——锚点 / 变异体编译 / 泄漏标记绑定 / 静态名册任一漂移
          # 即本步非零退出；全量杀灭轮（需要净树与共享 parity 租约）仍由协调者在宿主跑。
          python3 -I src/pilotdeck-gateway/tests/fixtures/parity-env-isolation/negative_controls.py --check
          # #2513 fix-r2（评审 DS concurrency#1 建议，同上先例）：cli-parity-lock-bounded
          # 的静态断言进 CI——其守护集必须仍落在 parity 锁族（parity_guarded 四前缀），
          # 否则变异窗会静默失去共享租约、活体 cli-parity 轮次又能与窗口交错；断言不取
          # 租约、不建目录，CI 可直接跑，全量杀灭轮仍由协调者在宿主跑。
          python3 -I src/pilotdeck-gateway/tests/fixtures/cli-parity-lock-bounded/negative_controls.py --check
          # #2488（#2566 先行补上 re-arm 行，#2488 再把 --check 深度对齐 cron-schedule）：
          # always-on-2294 负控夹具的 --check 也进 CI——锚点 / README 场景总数与分组
          # 计数 / Rows 名册 / 每个场景绑定回放 / 每条变异绑定的测试真的存在，任一
          # 漂移即本步非零退出；全量杀灭轮（需要 cargo 与净树）仍由协调者在宿主跑。
          # 名册闭集（名字+顺序+条数+夹具字节 SHA）另由 always_on 模块自己的
          # negative_controls_manifest Rust 测试钉死（随 rust job 跑）。
          python3 -I src/pilotdeck-gateway/tests/fixtures/always-on-2294/negative_controls.py --check
      # #2516 fix-r1（P2-a 5）：槽位探针残余负控全量进 CI。纯 Python 零 cargo
      # （变异体经 published_module 内存发布，不写树、不需要净树），全量含基线
      # 17 例 + 七杀 + 名册核验，任一 SURVIVED / INVALID / 名册漂移即本步非零
      # 退出；此前只靠宿主链，CI 上一条都不跑。
      - name: 槽位探针残余负控全量（#2516）
        shell: bash  # #1809 r9：合并带入的步骤补钉（r7 P0 执行层守卫）
        run: python3 -I src/pilotdeck-gateway/tests/fixtures/slot-probe-residual/negative-controls.py
      - name: session-assembly-1316 负控夹具执行（#1316 / #1632）
        shell: bash
        run: python3 -I src/pilotdeck-gateway/tests/fixtures/session-assembly-1316/negative_controls.py "$RUNNER_TEMP/negctl-1316"
      # 夹具为每条变异写了 .patch / .log / summary.json；job 红了才最需要它们，所以
      # 用 `if: always()` 上传（失败也要传）。#1632 评审：否则 runner 结束时证据全丢，
      # 排查只剩步骤日志里那几行 KILLED/SURVIVED。
      - name: 上传负控证据（#1632）
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: negctl-1316
          path: ${{ runner.temp }}/negctl-1316
          if-no-files-found: warn

  # retirement outcome-parity 装置（#1809）：把「判据还能不能用」接进 CI。
  # 纯 Python（无 Rust / Node 依赖），几秒钟跑完，因此不做 paths 过滤——多跑不可漏跑；
  # 与其它重 job 一样只受 scope 的 docs_only 分类控制（#1199 口径）。
  # 数据是**入库**的切片夹具 scripts/retirement-outcome-parity/fixtures（干净检出可复现），
  # 不再依赖未跟踪的 _tmp/。
  retirement-outcome-parity:
    needs: [scope]
    if: ${{ needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    # 外层预算必须**大于**全 job 内部最坏和 + 开销（r11 P0）：判据是
    # RETIREMENT_JOB_TIMEOUT_MINUTES × 60 > INTERNAL_WORST_CASE_SECONDS
    # + JOB_OVERHEAD_MARGIN_SECONDS，由 self_check.py 遍历实际 steps 求值
    # （retirement_budget_rows 与 RETIREMENT_STEP_ORDER 双向互证；未知贡献
    # 规则即红）。直跑 emit/check/负控以各自 step 声明的 timeout-minutes 为
    # 入算上限（负控原始贡献按其模块登记推导，再被声明限压低）；两项自检
    # 沿用 _assert_pass_counting 互证；checkout/setup/upload 显式共享
    # JOB_OVERHEAD_MARGIN_SECONDS 桶并核覆盖。量级给读者：有效内部和 ≈ 2.7 h，
    # 外层 170 min 低于托管 job 6 h 平台上限——具体数值以 retirement_budget_rows
    # 求值为准，本注释不维护第二份精确和（#2454；r9 85 min / r10 130 min 的
    # 不完整和均被替代，不改严格大于的派生判据）。
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      # #2017-A：接线守卫（r5 起）按 PyYAML 解析后的完整标量判，解析器版本钉死
      # 6.0.3（装置 README 登记）。`python3 -I` 不读 user site，但 venv 的 site-packages
      # 属解释器自身配置、`-I` 下仍可见（本机实测）；GITHUB_PATH 让后续闸门步的
      # `python3` 落在这个 venv 上，self_check 里另有版本 fail-closed 断言。
      - name: 安装钉死 PyYAML（#2017-A）
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/pyyaml-pinned"
          "$RUNNER_TEMP/pyyaml-pinned/bin/pip" install --disable-pip-version-check pyyaml==6.0.3
          echo "$RUNNER_TEMP/pyyaml-pinned/bin" >> "$GITHUB_PATH"
      # ① 金样可复现：emit 从入库夹具复算，必须与已提交 ts-oracle.json 逐字节相同。
      #    不一致 = 夹具或金样有一个被改过而另一个没跟上（或有人手改金样）。
      - name: emit 复算与金样逐字节比对
        shell: bash
        timeout-minutes: 5
        run: |
          F=scripts/retirement-outcome-parity/fixtures
          python3 -I scripts/retirement-outcome-parity/check_outcome_parity.py emit \
            --oracle "$RUNNER_TEMP/ts-oracle.json" \
            --round "$F/round-01" --round "$F/round-02" --round "$F/round-03" \
            --round "$F/round-04" --round "$F/round-05"
          cmp "$RUNNER_TEMP/ts-oracle.json" scripts/retirement-outcome-parity/ts-oracle.json
      # ② 判据 5 轮全 PASS（含 P7 跨轮稳定性——单轮时 P7 是空判，报告会写 p7Evaluated）。
      - name: check 5 轮
        shell: bash
        timeout-minutes: 5
        run: |
          F=scripts/retirement-outcome-parity/fixtures
          python3 -I scripts/retirement-outcome-parity/check_outcome_parity.py check \
            --oracle scripts/retirement-outcome-parity/ts-oracle.json \
            --round "$F/round-01" --round "$F/round-02" --round "$F/round-03" \
            --round "$F/round-04" --round "$F/round-05"
      # ③ 负控 N1–N17 全 KILLED（任一非 KILLED 即非零退出；正控注册数现 0，
      #    A8.6-R1 的 PC1–PC2 与 N18 已随 #2294 按反转条款撤回——条数守卫仍在，
      #    将来再登记正控时改 EXPECTED_POSITIVES 单一登记点）。
      #    默认 --data 指向入库夹具；输出目录在 RUNNER_TEMP，供下一步上传。
      - name: 负控 N1–N17 全 KILLED
        shell: bash
        run: |
          python3 -I scripts/retirement-outcome-parity/negative_controls.py \
            --output "$RUNNER_TEMP/retirement-outcome-parity-negctl"
        timeout-minutes: 30
      # ④ 装置守卫自检：七项全跑（体积预算 / emit 复算 / 5 轮判据 / 负控 / 输出目录锁 /
      #    敌意写目标 / CI 接线）。前四项与 ①–③ 重叠是**有意**的：那三条分支只有在 self_check 里被
      #    真正执行过才算数（否则它们只是没人跑的死代码），整套约 5 s。后三项是「守卫本身
      #    还在不在」——拆掉任一处（删体积上限 / 删 flock / 删敌意目标判定 / 删上面的步骤）本步即红。
      - name: 装置守卫自检（七项）
        shell: bash
        run: |
          python3 -I scripts/retirement-outcome-parity/self_check.py
      # ⑤ 接线守卫自身的变异自检：把本文件按「删行/注释掉/禁用 step」三种方式变异，
      #    每种都必须被 check_wiring 判红。少了这一步，接线守卫退化成常量比对也没人知道。
      - name: 接线守卫变异自检
        shell: bash
        run: |
          python3 -I scripts/retirement-outcome-parity/self_check.py --self-check-controls
      # 红了才最需要逐条证据（summary.json 里每条 KILLED / SURVIVED / INVALID + 原因）。
      - name: 上传负控证据
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: retirement-outcome-parity-negctl
          path: ${{ runner.temp }}/retirement-outcome-parity-negctl
          if-no-files-found: warn

  # 保留必需检查名。#1199 后合并闸门语义：scope 非 success 一律拒绝；各重 job 的结果
  # 「非 success 且不是（skipped 且 docs_only=true）」才拒绝——即分类器确定纯文档改动才
  # 接受 skipped，取消 / 其他跳过照旧拒绝（#904 的有意放宽，边界见 state/decisions-20261031-ci-docs-scope.md）。
  check:
    needs: [scope, metadata-observer, rust, a51-coverage, negative-controls, retirement-outcome-parity]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require scope success
        if: ${{ always() && needs.scope.result != 'success' }}
        working-directory: .
        shell: bash
        run: exit 1
      - name: Require metadata observer success
        if: ${{ always() && needs.metadata-observer.result != 'success' && !(needs.metadata-observer.result == 'skipped' && needs.scope.outputs.docs_only == 'true') }}
        working-directory: .
        shell: bash
        run: exit 1
      - name: Require Rust success
        if: ${{ always() && needs.rust.result != 'success' && !(needs.rust.result == 'skipped' && needs.scope.outputs.docs_only == 'true') }}
        shell: bash
        run: exit 1
      - name: Require A5.1 coverage success
        if: ${{ always() && needs.a51-coverage.result != 'success' && !(needs.a51-coverage.result == 'skipped' && needs.scope.outputs.docs_only == 'true') }}
        shell: bash
        run: exit 1
      - name: Require negative control success
        if: ${{ always() && needs.negative-controls.result != 'success' && !(needs.negative-controls.result == 'skipped' && needs.scope.outputs.docs_only == 'true') }}
        shell: bash
        run: exit 1
      - name: Require retirement outcome-parity success
        if: ${{ always() && needs.retirement-outcome-parity.result != 'success' && !(needs.retirement-outcome-parity.result == 'skipped' && needs.scope.outputs.docs_only == 'true') }}
        shell: bash
        run: exit 1

  rust:
    needs: [scope]
    if: ${{ needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    defaults:
      run:
        # workspace 在 src/ 不在仓库根（demo/04 §4.6）
        working-directory: src
    steps:
      - uses: actions/checkout@v4
        with:
          # --base needs merge-base history for PRs and merge queue commits.
          fetch-depth: 0
      # 盲区⑤（#2762 防复发，人批 2026-11-10）：runner 镜像漂移守卫。#2763 把全部
      # runs-on 钉回 ubuntu-24.04，但「标签被改回漂移标签 / 24.04 标签被平台重指到
      # 新镜像」都没有任何机检——#2762 那次是三个测试稳定红、merge queue 整批被踢、
      # 约一天才定位到镜像。本步 fail-fast：OS / $ImageOS / $ImageVersion 三个维度
      # 与下方四个钉值不一致立即红，错误行同打实际与期望两个值。放在 rust job 的
      # checkout 之后第一步：#2762 的三个红测试都在本 job，漂移先红在这里，别等
      # 全量测试跑完才红。fix-r2（#2780 MM）：期望值单点定义在四个变量（改钉两副本
      # 同改，test_metadata_io_driver 逐字全等机检强制）；反向断言改白名单值等——
      # ci.yml 与 pr-gate.yml 的全部非注释 runs-on 必须等于钉定标签。
      - name: runner 镜像漂移守卫（#2762）
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          # 期望值单点：本步四个钉值全在下面四个变量里（fix-r2 起两副本由
          # test_metadata_io_driver 逐字全等机检钉住，改钉必须两处同改）。
          # fix-r3（#2780 anthropic boundary P1，协调者裁 b）：构建号钉值从单一
          # 精确值改为钉值集合 expected_image_versions（空格分隔，命中任一即绿）。
          expected="24.04"
          expected_label="ubuntu-24.04"
          expected_image_os="ubuntu24"
          expected_image_versions="20261101.360.1"
          # PDRS_IMAGE_GUARD_OS_RELEASE 只重定向 os-release 的读取路径（供本仓
          # 守卫逻辑自测注入假 os-release），钉值比对不变；该行被机检钉死。
          os_release="${PDRS_IMAGE_GUARD_OS_RELEASE:-/etc/os-release}"
          actual=""
          if [ -r "$os_release" ]; then
            . "$os_release"
            actual="${VERSION_ID:-}"
          fi
          if [ "$actual" != "$expected" ]; then
            echo "::error::runner 镜像漂移：实际 OS 版本=\"${actual:-<读不到>}\"，钉定=\"$expected\"（#2762：全仓稳定红先查 runner 镜像，别逐个测试倒查）" >&2
            exit 1
          fi
          # fix-r2（#2780 MM P1）：构建维度。GitHub 托管镜像按构建滚动，VERSION_ID
          # 不变的镜像重指 / 滚动窗口内两 job 落在不同构建都会翻转 KILLED/SURVIVED
          # 结论。fix-r3（#2780 anthropic boundary P1，协调者裁 b）：单一精确构建号
          # 在滚动窗口内没有稳定绿值（fleet 分批换版本），改为钉值集合——两副本钉
          # 同一集合，实际值命中任一成员即绿。滚动窗口处置流程：① 守卫红且错误行
          # 显示的「实际构建号」经值班协调者确认为上游 runner-images 新滚动版本后，
          # 把该值追加进 expected_image_versions（两副本同改，全等机检强制），当轮
          # 恢复绿；② 窗口结束（上游该版本 rollout 完成、实际值连续几天稳定在新值）
          # 后由值班协调者删旧值，收窄回单值。谁做/何时：值班协调者，红当轮加新值、
          # 窗口结束当轮删旧值。窗口内两 job 可能落在集合内不同构建上，「同绿」语义
          # 放宽为「同在已登记集合」；需要严格同构建的对拍/负控结论时先删旧值收窄
          # 再跑。空集合与未提供实际值都 fail-closed：不提供不等于命中集合。
          image_os="${ImageOS:-}"
          image_version="${ImageVersion:-}"
          if [ -z "${expected_image_versions// /}" ]; then
            echo "::error::钉值集合 expected_image_versions 为空，fail-closed（#2780 fix-r3：空集合守卫哑炮）" >&2
            exit 1
          fi
          if [ "$image_os" != "$expected_image_os" ] || [ -z "$image_version" ]; then
            echo "::error::runner 镜像漂移：实际 ImageOS=\"${image_os:-<未提供>}\" ImageVersion=\"${image_version:-<未提供>}\"，钉定 ImageOS=$expected_image_os ImageVersion∈{$expected_image_versions}（#2780 fix-r3：镜像滚动先红再改钉，别拿漂移构建上的结论）" >&2
            exit 1
          fi
          version_hit=0
          for member in $expected_image_versions; do
            if [ "$image_version" = "$member" ]; then
              version_hit=1
              break
            fi
          done
          if [ "$version_hit" -ne 1 ]; then
            echo "::error::runner 镜像漂移：实际 ImageVersion=\"$image_version\" 不在钉定集合 {$expected_image_versions}（#2780 fix-r3：确认为上游新滚动版本后把该值追加进集合，两副本同改）" >&2
            exit 1
          fi
          echo "runner 镜像守卫通过：OS 版本 $actual / ImageOS $image_os / ImageVersion $image_version ∈ 钉定集合 {$expected_image_versions}"
          # fix-r2（#2780 MM P1）：反向断言从「字面量 ubuntu-latest 黑名单 × 仅
          # ci.yml」改为白名单值等——ci.yml 与 pr-gate.yml 的全部非注释 runs-on 值
          # 必须等于钉定标签，任何其他值（ubuntu-latest / -arm / 26.04 / 22.04 /
          # matrix 拼装）一律红。键形态连引号键一起认（#2017 先例）。fix-r1 的
          # 「目标可读前置核 + grep rc 三分」口径保留，另加零命中 fail-closed。
          for guard_target in .github/workflows/ci.yml .github/workflows/pr-gate.yml; do
            if [ ! -r "$guard_target" ]; then
              echo "::error::反向断言目标 $guard_target 不可读，fail-closed（#2780 fix-r2：断言不许哑炮放行）" >&2
              exit 1
            fi
            rc=0
            raw="$(grep -nE "^[[:space:]]*['\"]?runs-on['\"]?[[:space:]]*:" "$guard_target")" || rc=$?
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
              echo "::error::grep 检查 $guard_target 异常退出 rc=$rc，fail-closed（#2780 fix-r2）" >&2
              exit 1
            fi
            if [ -z "$raw" ]; then
              echo "::error::$guard_target 一条 runs-on 都没解析到，fail-closed（#2780 fix-r2：白名单不许静默通过）" >&2
              exit 1
            fi
            while IFS= read -r hit; do
              [ -n "$hit" ] || continue
              body="${hit#*:}"
              trimmed="${body#"${body%%[![:space:]]*}"}"
              key="${trimmed%%:*}"
              key="${key//[[:space:]]/}"
              case "$key" in
                runs-on|\'runs-on\'|\"runs-on\") ;;
                *) echo "::error::$guard_target 解析到非 runs-on 行 \"$hit\"，fail-closed（#2780 fix-r2）" >&2
                   exit 1 ;;
              esac
              value="${trimmed#*:}"
              value="${value%%#*}"
              value="${value//\"/}"
              value="${value//\'/}"
              value="${value//[[:space:]]/}"
              if [ "$value" != "$expected_label" ]; then
                echo "::error::$guard_target 的 runs-on 值 \"$value\" != 钉定 \"$expected_label\"（#2762：全部 runs-on 必须钉 $expected_label）" >&2
                printf '%s\n' "$hit" >&2
                exit 1
              fi
            done <<< "$raw"
          done
          echo "runs-on 白名单反向断言通过：ci.yml 与 pr-gate.yml 非注释 runs-on 全部 == $expected_label"
      # rustup 读仓库根的 rust-toolchain.toml，装锁定的版本与 fmt/clippy
      - shell: bash
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src -> target
          # rg / cargo-nextest 沿用下方独立缓存，避免重复缓存 ~/.cargo/bin。
          cache-bin: false
      - name: 格式
        shell: bash
        run: cargo fmt --all --check
      - name: lint
        shell: bash
        run: cargo clippy --all-targets -- -D warnings
      # grep 金样对拍要真实 rg（版本对齐基线 @vscode/ripgrep 1.18.0 自带的 15.0.0，金样即以此录制）；从源码编译（不下载预编译二进制，人定 2026-10-22），按版本缓存
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/rg
          key: ripgrep-15.0.0-${{ runner.os }}
      - name: ripgrep（cargo install 源码编译）
        # 镜像可能自带其他版本的 rg：只认 ~/.cargo/bin/rg 且版本须为 15.0.0，否则强制重装
        shell: bash
        run: |
          "$HOME/.cargo/bin/rg" --version 2>/dev/null | grep -qx 'ripgrep 15.0.0' \
            || cargo install ripgrep --locked --version 15.0.0 --force
          # 把 ~/.cargo/bin 放到 PATH 最前，对拍按 PATH 顺序先找到钉住版本的 rg（不设全局 override，免得影响其他 grep 测试）
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rg" --version
      # 0.9.148 发布于 2026-10-08；从源码安装，缓存只按钉死版本与 runner 平台复用。
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: cargo-nextest-0.9.148-${{ runner.os }}-${{ runner.arch }}
      - name: cargo-nextest（cargo install 源码编译）
        shell: bash
        run: |
          "$HOME/.cargo/bin/cargo-nextest" --version 2>/dev/null | grep -qx 'cargo-nextest 0.9.148' \
            || cargo install cargo-nextest --locked --version 0.9.148 --force
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo-nextest" --version
      - name: 测试
        env:
          # #1525 / #1263：权限故障探针在特权宿主（root / CAP_DAC_OVERRIDE）上必然成功，
          # 用例只能跳过、却被记成 PASS。CI 与正式宿主开这个开关，把「跳过」变成硬失败；
          # 需要保留跳过的 root 宿主在配方里显式不要导出它。回归：tests/common/permission_faults.rs。
          PDRS_REQUIRE_PERMISSION_FAULTS: "1"
        shell: bash
        run: cargo nextest run --workspace --no-fail-fast --profile ci --config-file ../.config/nextest.toml
      # nextest 不运行 doctest；单列一步保留原 cargo test --all 的检查范围。
      - name: 文档测试
        shell: bash
        run: cargo test --workspace --doc
      - name: smoke provider 装置正负控（含 Rust probe）
        working-directory: .
        shell: bash
        run: python3 -I scripts/test-smoke-real-provider.py
      - name: C · parity 冻结装置（干净检出）
        working-directory: .
        shell: bash
        run: python3 -I scripts/parity/check_frozen.py
      # A3 · gateway 协议 schema 静态断言：CI 没有基线目录（resources/ 不入库），
      # check_schema.py 自动退回「快照 × method-inventory.md × schema」三方比对；
      # 基线侧一致性由下方 gateway-schema-baseline job 按冻结 commit 克隆基线钉死。
      - name: gateway 协议 schema 静态断言（A3）
        working-directory: .
        shell: bash
        run: python3 -I scripts/gateway-parity/check_schema.py
      - name: 三套冻结账本（静态规则与只追加）
        working-directory: .
        env:
          LEDGER_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        shell: bash
        run: |
          python3 -I scripts/test-gateway-ledger.py -v
          python3 -I src/pilotdeck-gateway/tests/fixtures/ledger-diffs/test_ledger.py parity -v
          python3 -I src/pilotdeck-gateway/tests/fixtures/ledger-diffs/test_ledger.py ui-server-parity -v
          for apparatus in parity gateway-parity ui-server-parity; do
            python3 -I src/pilotdeck-gateway/tests/fixtures/frozen-manifest/test_manifest.py "$apparatus" -v
          done
          if [ "${{ github.event_name }}" != "push" ] && [ "$LEDGER_BASE" = "$(git rev-parse HEAD)" ]; then
            echo "ledger base 等于 HEAD（${{ github.event_name }}），只追加对照无效，拒绝" >&2; exit 1
          fi
          if [ -n "$LEDGER_BASE" ] && [ "$LEDGER_BASE" != "0000000000000000000000000000000000000000" ]; then
            for apparatus in parity gateway-parity ui-server-parity; do
              python3 -I "scripts/$apparatus/check_frozen.py" --base "$LEDGER_BASE"
            done
          else
            for apparatus in parity gateway-parity ui-server-parity; do
              python3 -I "scripts/$apparatus/check_frozen.py"
            done
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: upgrade 异常结束状态正负对照
        working-directory: .
        shell: bash
        run: node --test src/pilotdeck-gateway/tests/upgrade/check_suffix.test.mjs
      # A3 · schema 正负例（ajv draft-07）：正例必须过、负例必须拒——含 run_get 省略 result 的线上语义。
      # 依赖钉在 scripts/gateway-parity/package.json（ajv/ts-json-schema-generator/typescript），npm ci 可复现。
      - name: gateway 协议 schema 正负例（ajv）
        working-directory: scripts/gateway-parity
        shell: bash
        run: |
          npm ci --ignore-scripts --no-fund
          node validate_fixtures.mjs

  # A5.1 只依赖 Python、Node 与只读基线，不依赖 Rust 或其他 job 的产物。
  a51-coverage:
    needs: [scope]
    if: ${{ needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      # 校验器只读当前检出文件，不读取 Git 历史，默认浅检出即可。
      - uses: actions/checkout@v4
      - name: B2 冻结与批准依据（干净检出）
        working-directory: .
        shell: bash
        run: |
          python3 -I src/pilotdeck-gateway/tests/fixtures/frozen-reinsert-guard/test_entry_guard.py
          python3 -I src/pilotdeck-gateway/tests/fixtures/frozen-reinsert-guard/test_negative_controls.py
          python3 -I scripts/test-approval-provenance.py
          python3 -I scripts/test-review-deepseek.py
          python3 -I scripts/test-review-minimax.py
          python3 -I scripts/test-review-roles.py
          python3 -I scripts/test-check-taskbook-segments.py
          python3 -I scripts/test-check-frozen-delivery.py
          bash scripts/test-pdrs-loop.sh
          bash scripts/test-worktree-count.sh
          bash scripts/test-disk-budget.sh
          python3 -I scripts/check-approval-provenance.py
          python3 -I scripts/ui-server-parity/check_frozen.py
      # #1926：对拍归因装置的自测（含装置自身 sha256 pin，改判据必须显式 bump）。
      # 独立成一步：B2 步骤的命令序被 test_metadata_io_driver.py 逐字钉死，且失败归因要能一眼看出是装置自测。
      - name: 归因装置自测（scripts/parity-attrib）
        working-directory: .
        shell: bash
        run: python3 -I scripts/parity-attrib/test_frame_attrib.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装 A5.1 钉死依赖
        working-directory: scripts/gateway-parity
        shell: bash
        run: npm ci --ignore-scripts --no-fund
      # CI 没有 resources/ 基线；按冻结 commit 浅克隆，并使用上一步
      # 安装的 TypeScript 5.9.3。三条原命令保留默认内存/磁盘负例。
      - name: 浅克隆 A5.1 只读基线
        working-directory: .
        env:
          PILOTDECK_BASELINE_REF: cc7c4e653b15c8b2cec7bcf2d15d41d69396ae85 # schema-FROZEN.md
        shell: bash
        run: |
          git init pilotdeck-baseline
          git -C pilotdeck-baseline remote add origin https://github.com/OpenBMB/PilotDeck.git
          git -C pilotdeck-baseline fetch --depth 1 origin "$PILOTDECK_BASELINE_REF"
          git -C pilotdeck-baseline checkout FETCH_HEAD
      - name: A5.1 覆盖账本/清单（严格比较，默认带负例）
        working-directory: .
        env:
          PDRS_BASELINE: ${{ github.workspace }}/pilotdeck-baseline
        shell: bash
        run: |
          python3 -I scripts/gateway-coverage/check_ledger.py
          python3 -I scripts/gateway-coverage/check_coverage_manifest.py
          python3 -I scripts/gateway-coverage/test_strict_disk_inputs.py

  # A3 · 基线三角的第三边：按冻结 commit 浅克隆 OpenBMB/PilotDeck，再生成 schema 并与已提交产物
  # 字节比对（export_schema.mjs --check），随后跑 check_schema.py 的 L1–L3 基线核对。
  # 没有这个 job，CI 只能防「仓内清单 ↔ 生成物」漂移，防不了「冻结基线源码 ↔ 已提交产物」漂移
  # （schema 与快照本就是同一次生成，彼此一致不证明与基线一致）。依赖装得起（3 个钉死包 + lockfile），
  # 不需要「跳过基线」的退路；本地仍可用 PDRS_REQUIRE_BASELINE=1 把缺基线判 FAIL。
  gateway-schema-baseline:
    runs-on: ubuntu-24.04
    env:
      PILOTDECK_BASELINE_REF: cc7c4e653b15c8b2cec7bcf2d15d41d69396ae85 # OpenBMB/PilotDeck 冻结基线（2026-10-14，schema-FROZEN.md）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 浅克隆基线 OpenBMB/PilotDeck（冻结 commit）
        shell: bash
        run: |
          git init pilotdeck-baseline
          git -C pilotdeck-baseline remote add origin https://github.com/OpenBMB/PilotDeck.git
          git -C pilotdeck-baseline fetch --depth 1 origin "$PILOTDECK_BASELINE_REF"
          git -C pilotdeck-baseline checkout FETCH_HEAD
          echo "基线 commit: $(git -C pilotdeck-baseline rev-parse HEAD)"
      - name: 安装钉死依赖
        working-directory: scripts/gateway-parity
        shell: bash
        run: npm ci --ignore-scripts --no-fund
      - name: 再生成检查（冻结基线 × 已提交产物，字节一致）
        shell: bash
        run: node scripts/gateway-parity/export_schema.mjs --baseline "$GITHUB_WORKSPACE/pilotdeck-baseline" --check
      - name: 基线核对 L1–L3（缺基线即 FAIL）
        shell: bash
        run: |
          PDRS_REQUIRE_BASELINE=1 \
          PDRS_BASELINE="$GITHUB_WORKSPACE/pilotdeck-baseline" \
          python3 -I scripts/gateway-parity/check_schema.py
      - name: 产品入口覆盖总账（独立枚举 × 任务归属）
        shell: bash
        run: python3 scripts/product-coverage/check.py --baseline "$GITHUB_WORKSPACE/pilotdeck-baseline"
      - name: 入口漏项/重复/无主负对照及 UI runtime 对账
        shell: bash
        run: python3 scripts/product-coverage/test_check.py --baseline "$GITHUB_WORKSPACE/pilotdeck-baseline" -v
