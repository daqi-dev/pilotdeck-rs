name: ci

on:
  pull_request:
  push:
    branches: [main]
  # merge queue：必需检查 check / gateway-schema-baseline 必须也在队列的临时合并提交上跑，否则进队 PR 永远等不到结果
  merge_group:

jobs:
  # #1199：改动只碰唯一精确路径 state/board.md 时输出 docs_only=true，各重 job 才允许跳过；
  # state/ .42cog/ docs/ 的其余文件是重 job 尺子的输入，不放行（fix-r1 收窄，见
  # state/decisions-20261031-ci-docs-scope.md）。本 job 自身无条件运行（先跑分类器自测），
  # 重 job 的跳过只认它的输出，check 只放行「skipped 且 docs_only=true」这一条路径。
  scope:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          # base..head 两点 diff 要 PR / merge group 的历史，浅克隆没有
          fetch-depth: 0
      - name: 分类器自测（正负例与内存内变异负控）
        run: python3 -I scripts/test-ci-scope.py
      - name: 分类改动范围（docs-only 判定，fail-closed）
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        run: python3 -I scripts/ci_scope.py

  metadata-observer:
    needs: [scope]
    if: ${{ needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: CI 聚合门控与各 job 的 Node 前置守卫
        working-directory: src/pilotdeck-gateway/tests
        run: python3 -m unittest -v test_metadata_io_driver.EnvironmentControls
      - name: metadata observer generation 正负控（自有文件）
        run: node src/pilotdeck-gateway/tests/test_metadata_observer.mjs
      - name: 共享执行器隔离与候选正控回归（#994）
        run: python3 -B src/pilotdeck-gateway/tests/fixtures/test_negative_adaptive_isolation.py
      # #1666 / #1734：负控脚本的守卫不得依赖 assert —— `python3 -O` /
      # `PYTHONOPTIMIZE=1` 会把 assert 整条剥离，靠 assert 的守卫在优化解释器下静默
      # 放行（未知变异名 → `0/0 killed`、rc=0）。这两个自测在加与不加 `-O` 的解释器下
      # 各复算**未知变异名**这一条拒绝路径（其余拒绝路径由 settings-gateway 的进程内
      # 用例覆盖，不在 -O 下），且第一个用例先自证本解释器确实剥离 assert（否则整组
      # 结论无意义）；另有一条只减不增的裸 assert 存量登记。两者都不需要 cargo。
      - name: 网关负控守卫 -O 不变性自测（#1666/#1734）
        working-directory: src/pilotdeck-gateway/tests/fixtures
        run: |
          python3 -B -m unittest -v test_negative_optimize_guards
          python3 -B -m unittest -v settings-gateway/test_negative_controls.py
      # #1203：CLI fixtures 的负控脚本自带 --check 锚点自检，但此前没有任何闸门跑它——
      # #1145 重构 transport.rs 后 stream-event-field 锚点过期（6 条里 5 条有效），CI、
      # 宿主清单、neg-for-diff 都没拦住，靠最终评审读码才发现。glob 统一覆盖今后新增的
      # 带 --check 脚本；任一锚点失配即本步非零退出；glob 一个都匹配不到同样按失败处理
      # （闸门不允许静默通过）。本地负控：故意改坏 transport.rs 的 stream-event-field 锚点
      # 后 --check 报 5/6 valid、rc=1（_tmp/20261026-issue-1053/neg-1203/）。
      - name: CLI fixtures 负控 --check 锚点自检（#1203）
        run: |
          found=0
          for script in src/pilotdeck-cli/tests/fixtures/*/negative_controls.py; do
            [ -f "$script" ] || continue
            found=1
            python3 -I "$script" --check
          done
          if [ "$found" -ne 1 ]; then
            echo 'no src/pilotdeck-cli/tests/fixtures/*/negative_controls.py found; the anchor gate must not silently pass' >&2
            exit 1
          fi
          # #1364 P0-a：闸门自身的负控。这两个脚本清空 mutations 后跑 --check 必须
          # 非零退出；若有人删掉 fail-closed 分支，--self-check 立即变红。
          # 今后新增带 --check 的脚本按需补同一接口，本步不强制。
          for script in src/pilotdeck-cli/tests/fixtures/sdk-decode-budget/negative_controls.py \
                        src/pilotdeck-cli/tests/fixtures/sdk-stdin/negative_controls.py; do
            python3 -I "$script" --self-check
          done
      # #1595 / #1594：`.gitleaks.toml` 的值级放行必须是 regexTarget="secret" + ^…$ 锚定
      # （原来 7 条哈希类用 match 是子串语义，Secret 里含该哈希的更长值会被顺带放行）。
      # 这里只跑不需要 gitleaks 的静态口径 + 检查器自身的变异负控；行为负控（真跑 gitleaks
      # 造「恰等于 / 含但不等于」样本）在有 gitleaks 的机器上由 `--static` 之外的模式执行，
      # CI runner 不带 gitleaks（红线：不下载预编译二进制）。
      - name: gitleaks 放行口径静态检查（#1595/#1594，含变异负控）
        run: python3 -I scripts/check-gitleaks-allowlist.py --static --self-check

  # #1632：session-assembly-1316 负控夹具此前只在本机与宿主链跑，CI 里没有任何闸门——
  # 锚点过期（源码改了、变异表没跟）或某条变异不再被杀，都没有 CI 步骤会红。先做静态
  # 锚点自检与槽位守卫自检（不跑 cargo），再逐条应用变异、跑点名测试、按字节还原；任一
  # 条非 KILLED 即非零退出。#1632 P2-3。本 job 与 rust 并行起跑，但 check 汇聚它，因此
  # 它仍在合并闸门的关键路径上。
  negative-controls:
    needs: [scope]
    if: ${{ needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    # 上界只作兜底：夹具自己按 PDRS_NEGCTL_DEADLINE（默认 5400 s）收口，并在
    # 截止 / SIGTERM 时还原源码、发 TIMEOUT summary 后非零退出（#1692 §1）。
    # 实测（run 42176640534）：平台 job 超时**不会**跳过 `if: always()` 上传，但会
    # 在两条变异之间硬杀进程 —— 源码停在变异态、没有 progress/summary、job 记成
    # cancelled 而不是有界红。所以这里的分钟数必须大于夹具内部预算 + 余量，
    # 由 test_metadata_io_driver 钉死。
    timeout-minutes: 150
    env:
      # #1692 §3：负控跑的是同一批 cargo 测试；不压 debuginfo 时每次调用要额外
      # 写几百 MB 的 DWARF，直接把 90 min 的预算耗在磁盘上。
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      # 夹具要求调用方提供 target；#1166 共享入口拒收 src/ 内与仓库根目录，
      # 树内 _build/cargo-target 是本仓负控的既有约定（fixtures/README.md）。
      CARGO_TARGET_DIR: ${{ github.workspace }}/_build/cargo-target
    steps:
      - uses: actions/checkout@v4
        with:
          # 变异前要按 git show HEAD:<path> 证明源码未被改动
          fetch-depth: 0
      - name: 锁定工具链
        run: rustup show active-toolchain
      # 只缓存 cargo 注册表 / git 源，不缓存 target：夹具的护身扫描器
      # （`negative_process._ensure_workspace_scanner`）见到现有可执行文件就直接复用、
      # 从不重建，而它的源码摘要 `include_str!` 冻结在二进制里。缓存还原出上一轮的
      # target 就会让「改了扫描器输入的 PR」拿到旧二进制 → 摘要不等 → SourceBaselineError
      # → 闸门假红，且报错让人「prebuild」，在 CI 里做不到（#1632 评审 P1）。
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: negctl-cargo-${{ runner.os }}-${{ hashFiles('src/Cargo.lock') }}
      - name: 网关负控锚点自检 + 槽位守卫自检（#1632）
        # --anchors-only 只读扫描全部网关夹具，任一锚点失配 / 脚本消失即 rc=1；
        # --self-check 证明槽位守卫在 python3 -O 下仍有界退出（旧 assert 版在 -O 下无界等待）；
        # --self-check-controls 逐条删掉自检里的守卫（截止拒绝 / 进度落盘 / 树锁持有 /
        # 空 gates 表）再跑一遍副本，全部必须变红，否则打印 SURVIVED 并非零退出（#1692）。
        run: |
          python3 -I src/pilotdeck-gateway/tests/fixtures/anchor_selfcheck.py --anchors-only
          python3 -I src/pilotdeck-gateway/tests/fixtures/session-assembly-1316/negative_controls.py --self-check
          python3 -I src/pilotdeck-gateway/tests/fixtures/session-assembly-1316/negative_controls.py --self-check-controls
      - name: session-assembly-1316 负控夹具执行（#1316 / #1632）
        run: python3 -I src/pilotdeck-gateway/tests/fixtures/session-assembly-1316/negative_controls.py "$RUNNER_TEMP/negctl-1316"
      # 夹具为每条变异写了 .patch / .log / summary.json；job 红了才最需要它们，所以
      # 用 `if: always()` 上传（失败也要传）。#1632 评审：否则 runner 结束时证据全丢，
      # 排查只剩步骤日志里那几行 KILLED/SURVIVED。
      - name: 上传负控证据（#1632）
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: negctl-1316
          path: ${{ runner.temp }}/negctl-1316
          if-no-files-found: warn

  # 保留必需检查名。#1199 后合并闸门语义：scope 非 success 一律拒绝；各重 job 的结果
  # 「非 success 且不是（skipped 且 docs_only=true）」才拒绝——即分类器确定纯文档改动才
  # 接受 skipped，取消 / 其他跳过照旧拒绝（#904 的有意放宽，边界见 state/decisions-20261031-ci-docs-scope.md）。
  check:
    needs: [scope, metadata-observer, rust, a51-coverage, negative-controls]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require scope success
        if: ${{ always() && needs.scope.result != 'success' }}
        working-directory: .
        run: exit 1
      - name: Require metadata observer success
        if: ${{ always() && needs.metadata-observer.result != 'success' && !(needs.metadata-observer.result == 'skipped' && needs.scope.outputs.docs_only == 'true') }}
        working-directory: .
        run: exit 1
      - name: Require Rust success
        if: ${{ always() && needs.rust.result != 'success' && !(needs.rust.result == 'skipped' && needs.scope.outputs.docs_only == 'true') }}
        run: exit 1
      - name: Require A5.1 coverage success
        if: ${{ always() && needs.a51-coverage.result != 'success' && !(needs.a51-coverage.result == 'skipped' && needs.scope.outputs.docs_only == 'true') }}
        run: exit 1
      - name: Require negative control success
        if: ${{ always() && needs.negative-controls.result != 'success' && !(needs.negative-controls.result == 'skipped' && needs.scope.outputs.docs_only == 'true') }}
        run: exit 1

  rust:
    needs: [scope]
    if: ${{ needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    defaults:
      run:
        # workspace 在 src/ 不在仓库根（demo/04 §4.6）
        working-directory: src
    steps:
      - uses: actions/checkout@v4
        with:
          # --base needs merge-base history for PRs and merge queue commits.
          fetch-depth: 0
      # rustup 读仓库根的 rust-toolchain.toml，装锁定的版本与 fmt/clippy
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src -> target
          # rg / cargo-nextest 沿用下方独立缓存，避免重复缓存 ~/.cargo/bin。
          cache-bin: false
      - name: 格式
        run: cargo fmt --all --check
      - name: lint
        run: cargo clippy --all-targets -- -D warnings
      # grep 金样对拍要真实 rg（版本对齐基线 @vscode/ripgrep 1.18.0 自带的 15.0.0，金样即以此录制）；从源码编译（不下载预编译二进制，人定 2026-10-22），按版本缓存
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/rg
          key: ripgrep-15.0.0-${{ runner.os }}
      - name: ripgrep（cargo install 源码编译）
        # 镜像可能自带其他版本的 rg：只认 ~/.cargo/bin/rg 且版本须为 15.0.0，否则强制重装
        run: |
          "$HOME/.cargo/bin/rg" --version 2>/dev/null | grep -qx 'ripgrep 15.0.0' \
            || cargo install ripgrep --locked --version 15.0.0 --force
          # 把 ~/.cargo/bin 放到 PATH 最前，对拍按 PATH 顺序先找到钉住版本的 rg（不设全局 override，免得影响其他 grep 测试）
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rg" --version
      # 0.9.148 发布于 2026-10-08；从源码安装，缓存只按钉死版本与 runner 平台复用。
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: cargo-nextest-0.9.148-${{ runner.os }}-${{ runner.arch }}
      - name: cargo-nextest（cargo install 源码编译）
        run: |
          "$HOME/.cargo/bin/cargo-nextest" --version 2>/dev/null | grep -qx 'cargo-nextest 0.9.148' \
            || cargo install cargo-nextest --locked --version 0.9.148 --force
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo-nextest" --version
      - name: 测试
        env:
          # #1525 / #1263：权限故障探针在特权宿主（root / CAP_DAC_OVERRIDE）上必然成功，
          # 用例只能跳过、却被记成 PASS。CI 与正式宿主开这个开关，把「跳过」变成硬失败；
          # 需要保留跳过的 root 宿主在配方里显式不要导出它。回归：tests/common/permission_faults.rs。
          PDRS_REQUIRE_PERMISSION_FAULTS: "1"
        run: cargo nextest run --workspace --no-fail-fast --profile ci --config-file ../.config/nextest.toml
      # nextest 不运行 doctest；单列一步保留原 cargo test --all 的检查范围。
      - name: 文档测试
        run: cargo test --workspace --doc
      - name: smoke provider 装置正负控（含 Rust probe）
        working-directory: .
        run: python3 -I scripts/test-smoke-real-provider.py
      - name: C · parity 冻结装置（干净检出）
        working-directory: .
        run: python3 -I scripts/parity/check_frozen.py
      # A3 · gateway 协议 schema 静态断言：CI 没有基线目录（resources/ 不入库），
      # check_schema.py 自动退回「快照 × method-inventory.md × schema」三方比对；
      # 基线侧一致性由下方 gateway-schema-baseline job 按冻结 commit 克隆基线钉死。
      - name: gateway 协议 schema 静态断言（A3）
        working-directory: .
        run: python3 -I scripts/gateway-parity/check_schema.py
      - name: 三套冻结账本（静态规则与只追加）
        working-directory: .
        env:
          LEDGER_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          python3 -I scripts/test-gateway-ledger.py -v
          python3 -I src/pilotdeck-gateway/tests/fixtures/ledger-diffs/test_ledger.py parity -v
          python3 -I src/pilotdeck-gateway/tests/fixtures/ledger-diffs/test_ledger.py ui-server-parity -v
          for apparatus in parity gateway-parity ui-server-parity; do
            python3 -I src/pilotdeck-gateway/tests/fixtures/frozen-manifest/test_manifest.py "$apparatus" -v
          done
          if [ "${{ github.event_name }}" != "push" ] && [ "$LEDGER_BASE" = "$(git rev-parse HEAD)" ]; then
            echo "ledger base 等于 HEAD（${{ github.event_name }}），只追加对照无效，拒绝" >&2; exit 1
          fi
          if [ -n "$LEDGER_BASE" ] && [ "$LEDGER_BASE" != "0000000000000000000000000000000000000000" ]; then
            for apparatus in parity gateway-parity ui-server-parity; do
              python3 -I "scripts/$apparatus/check_frozen.py" --base "$LEDGER_BASE"
            done
          else
            for apparatus in parity gateway-parity ui-server-parity; do
              python3 -I "scripts/$apparatus/check_frozen.py"
            done
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: upgrade 异常结束状态正负对照
        working-directory: .
        run: node --test src/pilotdeck-gateway/tests/upgrade/check_suffix.test.mjs
      # A3 · schema 正负例（ajv draft-07）：正例必须过、负例必须拒——含 run_get 省略 result 的线上语义。
      # 依赖钉在 scripts/gateway-parity/package.json（ajv/ts-json-schema-generator/typescript），npm ci 可复现。
      - name: gateway 协议 schema 正负例（ajv）
        working-directory: scripts/gateway-parity
        run: |
          npm ci --ignore-scripts --no-fund
          node validate_fixtures.mjs

  # A5.1 只依赖 Python、Node 与只读基线，不依赖 Rust 或其他 job 的产物。
  a51-coverage:
    needs: [scope]
    if: ${{ needs.scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      # 校验器只读当前检出文件，不读取 Git 历史，默认浅检出即可。
      - uses: actions/checkout@v4
      - name: B2 冻结与批准依据（干净检出）
        working-directory: .
        run: |
          python3 -I src/pilotdeck-gateway/tests/fixtures/frozen-reinsert-guard/test_entry_guard.py
          python3 -I src/pilotdeck-gateway/tests/fixtures/frozen-reinsert-guard/test_negative_controls.py
          python3 -I scripts/test-approval-provenance.py
          python3 -I scripts/test-review-deepseek.py
          python3 -I scripts/test-review-minimax.py
          python3 -I scripts/test-review-roles.py
          python3 -I scripts/test-check-taskbook-segments.py
          python3 -I scripts/test-check-frozen-delivery.py
          bash scripts/test-pdrs-loop.sh
          bash scripts/test-worktree-count.sh
          bash scripts/test-disk-budget.sh
          python3 -I scripts/check-approval-provenance.py
          python3 -I scripts/ui-server-parity/check_frozen.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装 A5.1 钉死依赖
        working-directory: scripts/gateway-parity
        run: npm ci --ignore-scripts --no-fund
      # CI 没有 resources/ 基线；按冻结 commit 浅克隆，并使用上一步
      # 安装的 TypeScript 5.9.3。三条原命令保留默认内存/磁盘负例。
      - name: 浅克隆 A5.1 只读基线
        working-directory: .
        env:
          PILOTDECK_BASELINE_REF: cc7c4e653b15c8b2cec7bcf2d15d41d69396ae85 # schema-FROZEN.md
        run: |
          git init pilotdeck-baseline
          git -C pilotdeck-baseline remote add origin https://github.com/OpenBMB/PilotDeck.git
          git -C pilotdeck-baseline fetch --depth 1 origin "$PILOTDECK_BASELINE_REF"
          git -C pilotdeck-baseline checkout FETCH_HEAD
      - name: A5.1 覆盖账本/清单（严格比较，默认带负例）
        working-directory: .
        env:
          PDRS_BASELINE: ${{ github.workspace }}/pilotdeck-baseline
        run: |
          python3 -I scripts/gateway-coverage/check_ledger.py
          python3 -I scripts/gateway-coverage/check_coverage_manifest.py
          python3 -I scripts/gateway-coverage/test_strict_disk_inputs.py

  # A3 · 基线三角的第三边：按冻结 commit 浅克隆 OpenBMB/PilotDeck，再生成 schema 并与已提交产物
  # 字节比对（export_schema.mjs --check），随后跑 check_schema.py 的 L1–L3 基线核对。
  # 没有这个 job，CI 只能防「仓内清单 ↔ 生成物」漂移，防不了「冻结基线源码 ↔ 已提交产物」漂移
  # （schema 与快照本就是同一次生成，彼此一致不证明与基线一致）。依赖装得起（3 个钉死包 + lockfile），
  # 不需要「跳过基线」的退路；本地仍可用 PDRS_REQUIRE_BASELINE=1 把缺基线判 FAIL。
  gateway-schema-baseline:
    runs-on: ubuntu-latest
    env:
      PILOTDECK_BASELINE_REF: cc7c4e653b15c8b2cec7bcf2d15d41d69396ae85 # OpenBMB/PilotDeck 冻结基线（2026-10-14，schema-FROZEN.md）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 浅克隆基线 OpenBMB/PilotDeck（冻结 commit）
        run: |
          git init pilotdeck-baseline
          git -C pilotdeck-baseline remote add origin https://github.com/OpenBMB/PilotDeck.git
          git -C pilotdeck-baseline fetch --depth 1 origin "$PILOTDECK_BASELINE_REF"
          git -C pilotdeck-baseline checkout FETCH_HEAD
          echo "基线 commit: $(git -C pilotdeck-baseline rev-parse HEAD)"
      - name: 安装钉死依赖
        working-directory: scripts/gateway-parity
        run: npm ci --ignore-scripts --no-fund
      - name: 再生成检查（冻结基线 × 已提交产物，字节一致）
        run: node scripts/gateway-parity/export_schema.mjs --baseline "$GITHUB_WORKSPACE/pilotdeck-baseline" --check
      - name: 基线核对 L1–L3（缺基线即 FAIL）
        run: |
          PDRS_REQUIRE_BASELINE=1 \
          PDRS_BASELINE="$GITHUB_WORKSPACE/pilotdeck-baseline" \
          python3 -I scripts/gateway-parity/check_schema.py
      - name: 产品入口覆盖总账（独立枚举 × 任务归属）
        run: python3 scripts/product-coverage/check.py --baseline "$GITHUB_WORKSPACE/pilotdeck-baseline"
      - name: 入口漏项/重复/无主负对照及 UI runtime 对账
        run: python3 scripts/product-coverage/test_check.py --baseline "$GITHUB_WORKSPACE/pilotdeck-baseline" -v
