name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # job 名 = 分支保护里的必需状态检查名，改这里要同步改保护规则
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        # workspace 在 src/ 不在仓库根（demo/04 §4.6）
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      # rustup 读仓库根的 rust-toolchain.toml，装锁定的版本与 fmt/clippy
      - run: rustup show active-toolchain
      - name: 格式
        run: cargo fmt --all --check
      - name: lint
        run: cargo clippy --all-targets -- -D warnings
      - name: 测试
        run: cargo test --all
      # A3 · gateway 协议 schema 静态断言：CI 没有基线目录（resources/ 不入库），
      # check_schema.py 自动退回「快照 × method-inventory.md × schema」三方比对；基线核对只在本地跑。
      - name: gateway 协议 schema 静态断言（A3）
        working-directory: .
        run: python3 scripts/gateway-parity/check_schema.py
