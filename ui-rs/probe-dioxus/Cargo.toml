[package]
name = "probe-dioxus"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[workspace]

[features]
default = ["web"]
web = ["dioxus/web"]

[dependencies]
dioxus = { version = "=0.7.9", default-features = false, features = ["minimal", "web", "mounted"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement", "KeyboardEvent", "CompositionEvent", "Event", "EventTarget", "Storage", "Location", "WebSocket", "MessageEvent", "CloseEvent", "console"] }
js-sys = "=0.3.106"
gloo-net = { version = "=0.6.0", features = ["http"] }
gloo-timers = "=0.3.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = false
